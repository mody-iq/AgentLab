name: Test Gemini Models

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try each candidate model
        env:
          GEMINI_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          for M in gemini-3.8-flash gemini-3.7-flash gemini-3.5-flash gemini-3.1-pro-preview gemini-2.5-pro gemini-2.5-flash gemini-flash-latest gemini-pro-latest; do
            rm -f out.json
            HTTP=$(curl -sS --max-time 90 --retry 2 --retry-all-errors -o out.json -w "%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" \
              -H "x-goog-api-key: $GEMINI_KEY" \
              -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}]}' ) || HTTP="curl-failed"
            if [ "$HTTP" = "200" ]; then
              echo "$M -> OK"
            else
              MSG=$(jq -r '.error.message // empty' out.json 2>/dev/null | head -c 160)
              echo "$M -> $HTTP $MSG"
            fi
          done
          echo "done"
