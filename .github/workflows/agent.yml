name: Agent

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder name (letters, digits, - and _ only)"
        required: true
        type: string
      task:
        description: "What to build or change"
        required: true
        type: string
      max_iters:
        description: "Max build-fix attempts (1-8)"
        required: false
        default: "4"
        type: string

permissions:
  contents: write

jobs:
  agent:
    name: Write, build, fix
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project }}
      TASK: ${{ inputs.task }}
      MAX_ITERS: ${{ inputs.max_iters }}
      GEMINI_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging and signing tools
        run: brew install make ldid dpkg gnu-tar xz rsync

      - name: Configure Theos path
        run: |
          echo "THEOS=$RUNNER_TEMP/agent-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch RootHide Theos and iOS 16.5 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/agent-sdks"
          git -C "$RUNNER_TEMP/agent-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/agent-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Run agent
        run: python3 agent/agent.py

      - name: Commit project
        if: always()
        run: |
          if [ -d "$PROJECT" ]; then
            git config user.name "agent"
            git config user.email "agent@users.noreply.github.com"
            git add -A -- "$PROJECT"
            if git diff --cached --quiet; then
              echo "nothing to commit"
            else
              git commit -m "agent: $PROJECT"
              git push
            fi
          else
            echo "no project folder"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: out/
          if-no-files-found: ignore
